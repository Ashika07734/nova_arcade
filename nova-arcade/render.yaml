envVarGroups:
  - name: nova-arcade-common
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Nova Arcade
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: info
      - key: FILESYSTEM_DISK
        value: local

services:
  - type: web
    name: nova-arcade-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    preDeployCommand: mkdir -p database && touch database/database.sqlite && php artisan migrate --force
    healthCheckPath: /
    envVars:
      - fromGroup: nova-arcade-common
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
